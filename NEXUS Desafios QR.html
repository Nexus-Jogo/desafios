<style>
/* Layout: uma coluna de celular, uma pergunta por tela, tudo no tom do tabuleiro NEXUS (azul-noite + luzes por área). */
:root{
  --bg:#0E1230; --card:#171C45; --line:#2B3270; --fg:#F2F4FF; --muted:#A9B0DC;
  --accent:#8B5CF6; --accent-ink:#FFFFFF;
  --good:#2DD4BF; --warn:#FBBF24; --bad:#FB7185;
  --a1:#2DD4BF; --a2:#3B82F6; --a3:#EC4899; --a4:#FBBF24; --a5:#8B5CF6;
  --disp:"Bricolage Grotesque",system-ui,sans-serif; --body:"DM Sans",system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#F6F7FB; --card:#FFFFFF; --line:#D5DAF0; --fg:#1E2347; --muted:#5B6285;
  --accent:#6D3FE0; --good:#0B8F7E; --warn:#A97800; --bad:#D6304A;
  --a1:#0FA896; --a2:#2F6FE0; --a3:#D43A8C; --a4:#A97800; --a5:#6D3FE0; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F6F7FB; --card:#FFFFFF; --line:#D5DAF0; --fg:#1E2347; --muted:#5B6285;
  --accent:#6D3FE0; --good:#0B8F7E; --warn:#A97800; --bad:#D6304A;
  --a1:#0FA896; --a2:#2F6FE0; --a3:#D43A8C; --a4:#A97800; --a5:#6D3FE0; color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.logo{font-family:var(--disp);font-weight:800;letter-spacing:.06em;font-size:15px;color:var(--accent)}
h1{font-family:var(--disp);font-weight:800;font-size:clamp(30px,8vw,40px);line-height:1.08;margin:0;text-wrap:balance}
h2{font-family:var(--disp);font-weight:600;font-size:22px;line-height:1.25;margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c,var(--accent))}
.tag::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c,var(--accent));box-shadow:0 0 12px var(--c,var(--accent))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.steps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
button,.btn{font:inherit;cursor:pointer}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:16px 20px;font-weight:700;font-size:18px;width:100%}
.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-weight:500}
button:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:var(--card);color:var(--fg);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;min-height:52px}
.opt:hover:not(:disabled){border-color:var(--c,var(--accent))}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--card))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--card))}
.opt:disabled{cursor:default}
.dots{display:flex;gap:6px}
.dots i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--c,var(--accent))}
.dots i.done{background:var(--good)}
.dots i.miss{background:var(--bad)}
.post{border:1px dashed var(--line);border-radius:12px;padding:14px;font-size:16px;background:color-mix(in srgb,var(--card) 70%,var(--bg))}
.fb{border-left:4px solid var(--good);padding:10px 14px;background:var(--card);border-radius:0 10px 10px 0}
.fb.no{border-color:var(--bad)}
.fb b{display:block;margin-bottom:2px}
.big{font-family:var(--disp);font-weight:800;font-size:clamp(56px,20vw,96px);line-height:1;color:var(--c,var(--accent));text-shadow:0 0 28px color-mix(in srgb,var(--c,var(--accent)) 55%,transparent)}
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.res div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;display:flex;justify-content:space-between;gap:8px}
.up{color:var(--good);font-weight:700}.down{color:var(--bad);font-weight:700}
.menu{display:grid;gap:10px}
.menu a{display:block;text-decoration:none;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.menu a b{color:var(--c)}
.small{font-size:14px}
@media (prefers-reduced-motion:no-preference){.screen{animation:in .25s ease-out}@keyframes in{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>

var RES={eq:"Equilíbrio",rede:"Rede de apoio",auto:"Autoconhecimento",bem:"Bem-estar"};

/* ---------- utilidades ---------- */
function pickItems(k,d){
  var key="nexus_seen_"+k,seen=[];
  try{seen=JSON.parse(localStorage.getItem(key)||"[]")}catch(e){seen=[]}
  var all=d.pool.map(function(_,i){return i});
  var fresh=shuffle(all.filter(function(i){return seen.indexOf(i)<0}));
  var chosen=fresh.slice(0,d.n);
  if(chosen.length<d.n){
    seen=[];
    var rest=shuffle(all.filter(function(i){return chosen.indexOf(i)<0}));
    chosen=chosen.concat(rest.slice(0,d.n-chosen.length));
  }
  try{localStorage.setItem(key,JSON.stringify(seen.concat(chosen)))}catch(e){}
  return chosen.map(function(i){return d.pool[i]});
}
function $(h){var t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstChild}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var app=document.getElementById("app");
function show(node){app.replaceChildren(node)}

/* ---------- telas ---------- */
function menu(){
  var h='<div class="screen" style="display:flex;flex-direction:column;gap:18px"><div class="logo">NEXUS</div><h1>Desafios QR</h1><p class="muted">Cada casa QR CODE do tabuleiro abre um destes desafios. Não precisa de host nem de início de partida. Escolha um para testar.</p><div class="menu">';
  for(var k=1;k<=5;k++){h+='<a href="#'+k+'" style="--c:'+CH[k].c+'"><b>'+CH[k].tag+'</b><br>'+esc(CH[k].title)+'</a>'}
  h+='</div></div>';show($(h));
}
function intro(k){
  var d=CH[k];
  var node=$('<div class="screen" style="display:flex;flex-direction:column;gap:18px;--c:'+d.c+'"><div class="logo">NEXUS</div><span class="tag">'+d.tag+'</span><h1>'+esc(d.title)+'</h1><p>'+esc(d.intro)+'</p><div class="card"><b>Como funciona</b><ol class="steps"><li>Só a pessoa da vez usa o celular.</li><li>Responda sem pressa. Cada tela mostra o porquê.</li><li>No fim, o celular diz quantas casas você anda.</li></ol></div><button class="primary" id="go" style="background:'+d.c+';color:#0E1230">Começar</button><p class="small muted">Você pode dizer PASSO e pular este desafio. Nada é punição.</p></div>');
  show(node);node.querySelector("#go").onclick=function(){start(k)};
}
function start(k){
  var d=CH[k],items=pickItems(k,d),i=0,score=0,marks=[],eff={};
  function dots(){var s='<div class="dots">';for(var j=0;j<items.length;j++){s+='<i class="'+(marks[j]===1?"done":marks[j]===0?"miss":j===i?"on":"")+'"></i>'}return s+"</div>"}
  function draw(){
    var it=items[i],q,opts,ans;
    if(d.id===undefined){}
    var isFmf=Array.isArray(it);
    if(d.type==="quiz"&&isFmf){q=it[0];opts=d.opts;ans=d.opts.indexOf(it[1])}
    else if(d.type==="quiz"){q=it.q;var ord=shuffle(it.o.map(function(_,x){return x}));opts=ord.map(function(x){return it.o[x]});ans=ord.indexOf(it.a)}
    else{q=it.q;opts=it.o.map(function(x){return x[0]});ans=-1}
    var label=k===1?'Esta frase é:':k===2?'Qual pista entrega o problema?':'';
    var h='<div class="screen" style="display:flex;flex-direction:column;gap:16px;--c:'+d.c+'">'+dots()+'<span class="tag">'+(i+1)+' de '+items.length+'</span>';
    h+=(k<=2?'<div class="post">'+esc(q)+'</div><h2>'+label+'</h2>':'<h2>'+esc(q)+'</h2>');
    h+='<div class="opts">';
    opts.forEach(function(o,n){h+='<button class="opt" data-n="'+n+'">'+esc(o)+'</button>'});
    h+='</div><div id="fb"></div></div>';
    var node=$(h);show(node);
    node.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){pick(+b.dataset.n,node,it,ans,opts)}});
  }
  function next(){i++;if(i>=items.length)end();else draw()}
  function pick(n,node,it,ans,opts){
    var btns=node.querySelectorAll(".opt");btns.forEach(function(b){b.disabled=true});
    var fb=node.querySelector("#fb"),why,good;
    if(d.type==="quiz"){
      good=n===ans;btns[ans].classList.add("ok");if(!good)btns[n].classList.add("no");
      why=Array.isArray(it)?it[2]:it.w;marks[i]=good?1:0;if(good)score++;
      fb.innerHTML='<div class="fb '+(good?"":"no")+'"><b>'+(good?"Isso mesmo.":"Quase.")+(good?"":" Resposta: "+esc(opts[ans])+".")+'</b>'+esc(why)+'</div>';
    }else{
      var c=it.o[n];btns[n].classList.add("ok");marks[i]=1;
      for(var r in c[2]){eff[r]=(eff[r]||0)+c[2][r]}
      var chg=Object.keys(c[2]).map(function(r){return '<span class="'+(c[2][r]>0?"up":"down")+'">'+(c[2][r]>0?"▲ ":"▼ ")+RES[r]+'</span>'}).join(" · ");
      fb.innerHTML='<div class="fb"><b>'+esc(c[1])+'</b>'+(chg||'<span class="muted">Nenhum recurso muda.</span>')+'<br><span class="small muted">Pergunta para o grupo: o que poderia ser diferente?</span></div>';
    }
    var nb=$('<button class="primary" style="background:'+d.c+';color:#0E1230;margin-top:12px">'+(i+1>=items.length?"Ver resultado":"Próxima")+'</button>');
    fb.appendChild(nb);nb.onclick=next;nb.focus();
  }
  function end(){
    var steps,msg;
    if(d.type==="quiz"){var p=score/items.length;steps=p>=.8?3:p>=.4?2:1;
      msg=score+" de "+items.length+" certas. "+(steps===3?"Mandou bem.":steps===2?"Bom caminho.":"Você aprendeu coisas novas, e isso conta.");}
    else{steps=2;msg="Você fez "+items.length+" escolhas."}
    var h='<div class="screen" style="display:flex;flex-direction:column;gap:16px;--c:'+d.c+'">'+dots()+'<span class="tag">Resultado</span><p>'+esc(msg)+'</p><p class="muted">Ande</p><div class="big">+'+steps+'</div><p class="muted" style="margin-top:-8px">'+(steps===1?"casa":"casas")+' no tabuleiro</p>';
    if(d.type==="story"){h+='<div class="res">'+Object.keys(RES).map(function(r){var v=eff[r]||0;return '<div><span>'+RES[r]+'</span><span class="'+(v>0?"up":v<0?"down":"muted")+'">'+(v>0?"▲ +"+v:v<0?"▼ "+v:"=")+'</span></div>'}).join("")+'</div><p class="small muted">Ajuste as barras da sua ficha: sobe ou desce 1 por seta.</p>'}
    else if(steps===3){h+='<div class="card"><b>Bônus</b><span>Suba 1 barra de Autoconhecimento na sua ficha.</span></div>'}
    h+='<div class="card"><b>Mostre ao grupo e converse</b><span>'+esc(d.talk)+'</span></div><button class="primary" id="again" style="background:'+d.c+';color:#0E1230">Jogar de novo (perguntas novas)</button><button class="ghost" id="back">Voltar ao início</button></div>';
    var node=$(h);show(node);
    node.querySelector("#again").onclick=function(){start(k)};
    node.querySelector("#back").onclick=function(){location.hash="";route()};
  }
  draw();
}
function route(){
  var k=parseInt(location.hash.replace("#",""),10);
  if(k>=1&&k<=5)intro(k);else menu();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);route();
</script>
