/* Identidade NEXUS: azul-noite com grade, neon por área (Poppins + Inter). Abre sempre no escuro; claro é opcional. */
:root{
  --bg:#070b1f; --grid:rgba(96,120,255,.07); --card:#0b1233; --line:rgba(130,150,255,.35); --fg:#e8ecff; --muted:#aab6f0;
  --accent:#b36bff; --on:#070b1f;
  --good:#2ee6c5; --warn:#ffd23f; --bad:#ff5f7e;
  --a1:#2ee6c5; --a2:#4d8dff; --a3:#ff5fb0; --a4:#ffd23f; --a5:#b36bff;
  --glow:1; --disp:"Poppins",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f4f6fc; --grid:rgba(60,80,200,.06); --card:#ffffff; --line:#cfd5ee; --fg:#141a3a; --muted:#4a5278;
  --accent:#6a3fd6; --on:#ffffff; --good:#0b8f7e; --warn:#9a6d00; --bad:#d6304a;
  --a1:#0b8f7e; --a2:#2f6fe0; --a3:#c42f7f; --a4:#946a00; --a5:#6a3fd6; --glow:0; color-scheme:light}
*{box-sizing:border-box}
html{min-height:100%;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px}
body{margin:0;background:transparent;
  color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-block:max(12px,env(safe-area-inset-top,0px)) 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{max-width:560px;margin:0 auto 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--disp);font-weight:800;font-size:22px;letter-spacing:.14em;background:linear-gradient(90deg,#4da3ff,#b36bff 55%,#ff5fb0);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tool{display:inline-flex;align-items:center;gap:6px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font:600 14px var(--body);cursor:pointer;min-height:40px}
.tool svg{width:18px;height:18px;flex:0 0 auto}
.tool[aria-pressed="true"]{border-color:var(--accent);color:var(--on);background:var(--accent)}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.screen>.logo{display:none}
h1{font-family:var(--disp);font-weight:800;font-size:clamp(30px,8vw,40px);line-height:1.08;margin:0;text-wrap:balance}
h2{font-family:var(--disp);font-weight:600;font-size:22px;line-height:1.25;margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:8px;font-family:var(--disp);font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--c,var(--accent))}
.tag::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c,var(--accent));box-shadow:0 0 calc(12px * var(--glow)) var(--c,var(--accent))}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.steps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
button,.btn{font:inherit;cursor:pointer}
.primary{background:var(--c,var(--accent))!important;color:var(--on)!important;border:0;border-radius:14px;padding:16px 20px;font-family:var(--disp);font-weight:700;font-size:18px;width:100%;box-shadow:0 0 calc(18px * var(--glow)) color-mix(in srgb,var(--c,var(--accent)) 45%,transparent)}
.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-weight:500}
button:focus-visible,a:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:var(--card);color:var(--fg);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;min-height:52px}
.opt:hover:not(:disabled){border-color:var(--c,var(--accent))}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--card))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--card))}
.opt:disabled{cursor:default}
.dots{display:flex;gap:6px}
.dots i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--c,var(--accent))}
.dots i.done{background:var(--good)}
.dots i.miss{background:var(--bad)}
.post{border:1px dashed var(--line);border-radius:14px;padding:14px;font-size:16px;background:color-mix(in srgb,var(--card) 70%,var(--bg))}
.fb{border-left:4px solid var(--good);padding:10px 14px;background:var(--card);border-radius:0 12px 12px 0}
.fb.no{border-color:var(--bad)}
.fb b{display:block;margin-bottom:2px}
.big{font-family:var(--disp);font-weight:800;font-size:clamp(56px,20vw,96px);line-height:1;color:var(--c,var(--accent));text-shadow:0 0 calc(28px * var(--glow)) color-mix(in srgb,var(--c,var(--accent)) 55%,transparent)}
.menu{display:grid;gap:10px}
.menu a{display:block;text-decoration:none;color:var(--fg);background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:14px;padding:14px 16px}
.menu a b{color:var(--c);font-family:var(--disp)}
.small{font-size:14px}
.decor{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.decor svg{position:absolute;opacity:.32;filter:drop-shadow(0 0 4px currentColor)}
:root[data-theme="light"] .decor svg{opacity:.22;filter:none}
.bar,main{position:relative;z-index:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.screen{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>

<script>
/* ---------- tema e audiodescrição ---------- */
(function(){
  function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  var root=document.documentElement;
  var mode=get("nexus_theme")==="light"?"light":"dark";
  function applyTheme(){root.setAttribute("data-theme",mode);
    var b=document.getElementById("themeBtn");document.getElementById("themeIco").setAttribute("d",mode==="dark"?"M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4":"M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z");document.getElementById("themeLbl").textContent=mode==="dark"?"Claro":"Escuro";
    b.setAttribute("aria-label",mode==="dark"?"Modo escuro ativo. Toque para usar o modo claro.":"Modo claro ativo. Toque para voltar ao modo escuro.");
    var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",mode==="dark"?"#070b1f":"#f4f6fc");}
  document.getElementById("themeBtn").onclick=function(){mode=mode==="dark"?"light":"dark";set("nexus_theme",mode);applyTheme()};
  applyTheme();

  var synth=window.speechSynthesis, on=get("nexus_audio")==="1", voice=null;
  var aBtn=document.getElementById("audioBtn");
  if(!synth){aBtn.hidden=true}
  function pickVoice(){if(!synth)return;var v=synth.getVoices();voice=v.filter(function(x){return /^pt[-_]BR/i.test(x.lang)})[0]||v.filter(function(x){return /^pt/i.test(x.lang)})[0]||null}
  if(synth){pickVoice();synth.onvoiceschanged=pickVoice}
  function say(t){if(!synth||!t)return;synth.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="pt-BR";if(voice)u.voice=voice;u.rate=0.95;synth.speak(u)}
  function clean(t){return String(t).replace(/\s+/g," ").replace(/\+(\d)/g,"mais $1").replace(/·/g,",").trim()}
  function screenText(){
    var app=document.getElementById("app"),parts=[],n=0;
    app.querySelectorAll(".tag,h1,h2,.post,p,.card,.menu a,.opt,.fb,.big").forEach(function(el){
      var par=el.parentElement&&el.parentElement.closest(".card,.fb,.post,.menu a");
      if(par&&app.contains(par))return;
      var t=clean(el.innerText);if(!t)return;
      if(el.classList.contains("opt")){n++;t="Opção "+n+": "+t}
      if(el.classList.contains("post"))t="Publicação: "+t;
      parts.push(t);
    });
    var b=app.querySelector(".primary");if(b&&!b.closest("#fb"))parts.push("Botão: "+clean(b.innerText));
    return parts.join(". ");
  }
  function applyAudio(){aBtn.setAttribute("aria-pressed",on?"true":"false");aBtn.setAttribute("aria-label","Audiodescrição "+(on?"ligada. Toque para desligar":"desligada. Toque para ouvir"));document.getElementById("audioLbl").textContent=on?"Ouvindo":"Ouvir";if(!on&&synth)synth.cancel()}
  aBtn.onclick=function(){on=!on;set("nexus_audio",on?"1":"0");applyAudio();if(on)say("Audiodescrição ligada. "+screenText())};
  applyAudio();
  window.NX={
    onScreen:function(){if(on)setTimeout(function(){say(screenText())},150)},
    onFeedback:function(fb){if(on){var f=fb.querySelector(".fb");say(clean(f?f.innerText:"")+". Botão: "+clean(fb.querySelector(".primary").innerText))}}
  };
})();
</script>

/* ---------- utilidades ---------- */
function pickItems(k,d){
  var key="nexus_seen_"+k,seen=[];
  try{seen=JSON.parse(localStorage.getItem(key)||"[]")}catch(e){seen=[]}
  var all=d.pool.map(function(_,i){return i});
  var fresh=shuffle(all.filter(function(i){return seen.indexOf(i)<0}));
  var chosen=fresh.slice(0,d.n);
  if(chosen.length<d.n){
    seen=[];
    var rest=shuffle(all.filter(function(i){return chosen.indexOf(i)<0}));
    chosen=chosen.concat(rest.slice(0,d.n-chosen.length));
  }
  try{localStorage.setItem(key,JSON.stringify(seen.concat(chosen)))}catch(e){}
  return chosen.map(function(i){return d.pool[i]});
}
function $(h){var t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstChild}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var app=document.getElementById("app");
function show(node){app.replaceChildren(node);if(window.NX)NX.onScreen()}

function start(k){
  var d=CH[k],items=pickItems(k,d),i=0,score=0,marks=[],eff={};
  function dots(){var s='<div class="dots">';for(var j=0;j<items.length;j++){s+='<i class="'+(marks[j]===1?"done":marks[j]===0?"miss":j===i?"on":"")+'"></i>'}return s+"</div>"}
  function draw(){
    var it=items[i],q,opts,ans;
    if(d.id===undefined){}
    var isFmf=Array.isArray(it);
    if(d.type==="quiz"&&isFmf){q=it[0];opts=d.opts;ans=d.opts.indexOf(it[1])}
    else if(d.type==="quiz"){q=it.q;var ord=shuffle(it.o.map(function(_,x){return x}));opts=ord.map(function(x){return it.o[x]});ans=ord.indexOf(it.a)}
    else{q=it.q;opts=it.o.map(function(x){return x[0]});ans=-1}
    var label=k===1?'Esta frase é:':k===2?'Qual pista entrega o problema?':'';
    var h='<div class="screen" style="display:flex;flex-direction:column;gap:16px;--c:'+d.c+'">'+dots()+'<span class="tag">'+(i+1)+' de '+items.length+'</span>';

    h+='</div><div id="fb"></div></div>';
    var node=$(h);show(node);
    node.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){pick(+b.dataset.n,node,it,ans,opts)}});
  }
  function next(){i++;if(i>=items.length)end();else draw()}
  function pick(n,node,it,ans,opts){
    var btns=node.querySelectorAll(".opt");btns.forEach(function(b){b.disabled=true});
    var fb=node.querySelector("#fb"),why,good;
    if(d.type==="quiz"){
      good=n===ans;btns[ans].classList.add("ok");if(!good)btns[n].classList.add("no");
      why=Array.isArray(it)?it[2]:it.w;marks[i]=good?1:0;if(good)score++;
      fb.innerHTML='<div class="fb '+(good?"":"no")+'"><b>'+(good?"Isso mesmo.":"Quase.")+(good?"":" Resposta: "+esc(opts[ans])+".")+'</b>'+esc(why)+'</div>';
    }else{
      var c=it.o[n];btns[n].classList.add("ok");marks[i]=1;
      fb.innerHTML='<div class="fb"><b>'+esc(c[1])+'</b><span class="small muted">Pergunta para o grupo: o que poderia ser diferente?</span></div>';
    }
    var nb=$('<button class="primary" style="margin-top:12px">'+(i+1>=items.length?"Ver resultado":"Próxima")+'</button>');
    fb.appendChild(nb);nb.onclick=next;nb.focus();if(window.NX)NX.onFeedback(fb);
  }
  function end(){
    var steps,msg;
    if(d.type==="quiz"){var p=score/items.length;steps=p>=.8?3:p>=.4?2:1;
      msg=score+" de "+items.length+" certas. "+(steps===3?"Mandou bem.":steps===2?"Bom caminho.":"Você aprendeu coisas novas, e isso conta.");}
    else{steps=2;msg="Você fez "+items.length+" escolhas."}
    var h='<div class="screen" style="display:flex;flex-direction:column;gap:16px;--c:'+d.c+'">'+dots()+'<span class="tag">Resultado</span><p>'+esc(msg)+'</p><p class="muted">Ande</p><div class="big">+'+steps+'</div><p class="muted" style="margin-top:-8px">'+(steps===1?"casa":"casas")+' no tabuleiro</p>';
    h+='<div class="card"><b>Mostre ao grupo e converse</b><span>'+esc(d.talk)+'</span></div><button class="primary" id="again" >Jogar de novo (perguntas novas)</button><button class="ghost" id="back">Voltar ao início</button></div>';
    var node=$(h);show(node);
    node.querySelector("#again").onclick=function(){start(k)};
    node.querySelector("#back").onclick=function(){location.hash="";route()};
  }
  draw();
}
function route(){
  var k=parseInt(location.hash.replace("#",""),10);
  if(k>=1&&k<=5)intro(k);else menu();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);route();
</script>
